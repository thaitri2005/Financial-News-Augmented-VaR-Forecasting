[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "newsvar"
version = "0.1.0"
description = "Local, auditable financial-news VaR research"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "exchange-calendars==4.13.2",
  "psutil>=5.9,<8",
  "pyarrow==25.0.1",
  "typer>=0.12,<1",
  "tzdata>=2025.1",
]

[project.scripts]
newsvar = "newsvar.cli:app"

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8,<10",
  "ruff>=0.9,<1",
  "types-psutil>=5.9",
]
ml = [
    "torch==2.6.0",
    "transformers==4.49.0",
]
modeling = [
    "scikit-learn==1.6.1",
]
report = [
    "matplotlib>=3.9,<4",
]
risk = [
    "arch==7.2.0",
    "pandas==2.2.3",
    "statsmodels==0.14.5",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/newsvar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["src/**/*.py", "tests/**/*.py", "pyproject.toml"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src/newsvar"]
strict = true

[[tool.mypy.overrides]]
 module = ["exchange_calendars", "exchange_calendars.*", "pyarrow", "pyarrow.*", "scipy", "scipy.*", "transformers", "transformers.*", "sklearn", "sklearn.*", "huggingface_hub", "huggingface_hub.*", "joblib", "pandas", "pandas.*", "matplotlib", "matplotlib.*"]
ignore_missing_imports = true

[tool.uv]
cache-dir = ".cache/uv"
default-groups = ["dev", "ml", "modeling", "risk", "report"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
